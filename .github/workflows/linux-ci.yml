name: Linux CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            build/vcpkg_installed
          key: vcpkg-linux-dynamic-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-dynamic-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            lld \
            llvm \
            patchelf

      - name: Run tests
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          FEED_URL: ${{ secrets.NUGET_FEED_URL }}
          FEED_NAME: ${{ secrets.NUGET_FEED_NAME }}
          USERNAME: $ {{ secrets.NUGET_USERNAME }}
        run: make test
