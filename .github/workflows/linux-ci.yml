name: Linux Build and Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    name: Build and Test on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            build/vcpkg_installed
          key: vcpkg-linux-dynamic-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-dynamic-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            lld \
            llvm \
            patchelf

      - name: Install dependencies via vcpkg (dynamic linking)
        run: |
          vcpkg install --triplet x64-linux-dynamic
        shell: bash

      - name: Configure CMake with Clang + Ninja
        run: |
          cmake -B build \
            -S . \
            -G "Ninja" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build project
        run: |
          ninja -C build -v

      - name: List build outputs (debug)
        run: |
          echo "=== Executables ==="
          find build -type f -executable -name "instrument-*" | xargs ls -lh
          echo ""
          echo "=== Shared Libraries ==="
          find build -type f -name "*.so*" | xargs ls -lh
          echo ""
          echo "=== vcpkg Installed Libraries ==="
          find build/vcpkg_installed/x64-linux-dynamic/lib -type f -name "*.so*" 2>/dev/null | head -20
          echo ""
          echo "=== Test Executables ==="
          find build/tests -type f -executable 2>/dev/null | xargs ls -lh || echo "No test executables found"
          echo ""
          echo "=== Tools ==="
          find build -type f -executable -name "template-expander" 2>/dev/null | xargs ls -lh || echo "template-expander not found"

      - name: Run unit tests
        run: |
          export PATH="$PWD/build:$PATH"
          export LD_LIBRARY_PATH="$PWD/build:$PWD/build/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH"

          echo "Checking for instrument-worker..."
          which instrument-worker || echo "WARNING: instrument-worker not in PATH"

          echo "Checking for template-expander..."
          which template-expander || echo "WARNING: template-expander not in PATH (some tests may fail)"

          ./build/tests/unit_tests

      - name: Run integration tests
        run: |
          export PATH="$PWD/build:$PATH"
          export LD_LIBRARY_PATH="$PWD/build:$PWD/build/vcpkg_installed/x64-linux-dynamic/lib:$LD_LIBRARY_PATH"

          ./build/tests/integration_tests

      - name: Collect release artifacts
        run: |
          mkdir -p release-staging/instrument-script-server-linux-x64/{bin,include,licenses}

          echo "=== Copying Executables ==="
          # Copy main executables from build root
          find build -maxdepth 1 -type f -executable \
            \( -name "instrument-server" -o -name "instrument-worker" \) \
            -exec cp -v {} release-staging/instrument-script-server-linux-x64/bin/ \;

          # Copy template-expander if it exists
          if [ -f "build/template-expander" ]; then
            cp -v build/template-expander release-staging/instrument-script-server-linux-x64/bin/
          fi

          echo ""
          echo "=== Copying Core Library ==="
          # Copy core shared library to bin/ (merged with executables on Linux)
          find build -maxdepth 1 -type f -name "libinstrument-server-core.so*" \
            -exec cp -v {} release-staging/instrument-script-server-linux-x64/bin/ \;

          echo ""
          echo "=== Copying vcpkg Dependencies (Dynamic) ==="
          # Copy all vcpkg shared libraries (exclude gtest)
          if [ -d "build/vcpkg_installed/x64-linux-dynamic/lib" ]; then
            echo "Found vcpkg dynamic libraries:"
            find build/vcpkg_installed/x64-linux-dynamic/lib -type f -name "*.so*" \
              ! -name "*gtest*" ! -name "*gmock*" | head -20
            
            # Copy all .so files and their symlinks
            find build/vcpkg_installed/x64-linux-dynamic/lib \
              \( -type f -o -type l \) -name "*.so*" \
              ! -name "*gtest*" ! -name "*gmock*" \
              -exec cp -Pv {} release-staging/instrument-script-server-linux-x64/bin/ \;
          else
            echo "WARNING: No dynamic libraries found at build/vcpkg_installed/x64-linux-dynamic/lib"
            echo "This might indicate static linking was used instead of dynamic linking."
          fi

          echo ""
          echo "=== Copying Headers ==="
          # Copy public headers for the library
          if [ -d "include" ]; then
            cp -rv include/* release-staging/instrument-script-server-linux-x64/include/
          fi

          # Copy vcpkg headers (for users who want to build plugins)
          if [ -d "build/vcpkg_installed/x64-linux-dynamic/include" ]; then
            # Copy main include directories, excluding test frameworks
            for dir in build/vcpkg_installed/x64-linux-dynamic/include/*; do
              dirname=$(basename "$dir")
              if [[ "$dirname" != "gtest" && "$dirname" != "gmock" ]]; then
                cp -rv "$dir" release-staging/instrument-script-server-linux-x64/include/
              fi
            done
          fi

          echo ""
          echo "=== Verifying Dependencies with ldd ==="
          # Check what libraries the executables need
          for exe in release-staging/instrument-script-server-linux-x64/bin/instrument-server \
                     release-staging/instrument-script-server-linux-x64/bin/instrument-worker; do
            if [ -f "$exe" ]; then
              echo "--- Dependencies for $(basename $exe) ---"
              ldd "$exe" 2>&1 | grep -E "=> |not found" || true
            fi
          done

          echo ""
          echo "=== Collecting Licenses ==="
          # Copy project LICENSE to both root and licenses directory
          if [ -f "LICENSE" ]; then
            cp -v LICENSE release-staging/instrument-script-server-linux-x64/LICENSE
            cp -v LICENSE release-staging/instrument-script-server-linux-x64/licenses/instrument-script-server_LICENSE.txt
            echo "✓ Project LICENSE copied to root and licenses/"
          else
            echo "WARNING: Project LICENSE file not found!"
          fi

          # Collect vcpkg package licenses (exclude gtest)
          if [ -d "build/vcpkg_installed/x64-linux-dynamic/share" ]; then
            find build/vcpkg_installed/x64-linux-dynamic/share -type f \
              \( -name "copyright" -o -name "LICENSE*" -o -name "COPYING*" \) \
              -path "*/share/*" ! -path "*/gtest/*" ! -path "*/gmock/*" \
              -exec bash -c 'pkg=$(basename $(dirname $(dirname {}))); cp {} release-staging/instrument-script-server-linux-x64/licenses/${pkg}_LICENSE.txt 2>/dev/null || true' \;
            
            echo "✓ Dependency licenses collected"
          fi

          # Copy vcpkg manifest
          if [ -f "vcpkg.json" ]; then
            cp -v vcpkg.json release-staging/instrument-script-server-linux-x64/
          fi

          echo ""
          echo "=== Creating README ==="
          cat > release-staging/instrument-script-server-linux-x64/README.md <<'EOF'
          # Instrument Script Server - Linux x64 Release

          ## Package Contents

          ```
          instrument-script-server-linux-x64/
          ├── bin/                    # Executables and shared libraries
          │   ├── instrument-server   # Main server executable
          │   ├── instrument-worker   # Worker process executable
          │   ├── template-expander   # YAML template processor (if available)
          │   ├── *.so*               # All required shared libraries
          ├── include/                # Header files for plugin development
          ├── licenses/               # All applicable licenses
          │   ├── instrument-script-server_LICENSE.txt
          │   └── ... (dependency licenses)
          ├── LICENSE                 # Main project license (copy)
          ├── vcpkg.json              # Dependency manifest
          └── README.md               # This file
          ```

          ## Installation

          ### Option 1: Install to /opt (Recommended for system-wide use)

          This follows the Filesystem Hierarchy Standard (FHS) for third-party software and avoids conflicts with system packages.

          ```bash
          # Extract archive
          tar -xzf instrument-script-server-linux-x64.tar.gz

          # Install to /opt
          sudo mkdir -p /opt
          sudo mv instrument-script-server-linux-x64 /opt/instrument-script-server

          # Create wrapper scripts that set LD_LIBRARY_PATH
          sudo tee /usr/local/bin/instrument-server > /dev/null <<'WRAPPER'
          #!/bin/bash
          export LD_LIBRARY_PATH="/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"
          exec /opt/instrument-script-server/bin/instrument-server "$@"
          WRAPPER

          sudo tee /usr/local/bin/instrument-worker > /dev/null <<'WRAPPER'
          #!/bin/bash
          export LD_LIBRARY_PATH="/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"
          exec /opt/instrument-script-server/bin/instrument-worker "$@"
          WRAPPER

          sudo chmod +x /usr/local/bin/instrument-server /usr/local/bin/instrument-worker

          # If template-expander exists
          if [ -f /opt/instrument-script-server/bin/template-expander ]; then
            sudo tee /usr/local/bin/template-expander > /dev/null <<'WRAPPER'
          #!/bin/bash
          export LD_LIBRARY_PATH="/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"
          exec /opt/instrument-script-server/bin/template-expander "$@"
          WRAPPER
            sudo chmod +x /usr/local/bin/template-expander
          fi

          # Verify installation
          instrument-server --version
          ```

          **To uninstall:**
          ```bash
          sudo rm -rf /opt/instrument-script-server
          sudo rm -f /usr/local/bin/instrument-server /usr/local/bin/instrument-worker /usr/local/bin/template-expander
          ```

          ### Option 2: Portable User Installation (No root required)

          ```bash
          # Extract to your preferred location
          tar -xzf instrument-script-server-linux-x64.tar.gz
          mkdir -p ~/.local/opt
          mv instrument-script-server-linux-x64 ~/.local/opt/instrument-script-server

          # Create wrapper scripts in ~/.local/bin
          mkdir -p ~/.local/bin

          cat > ~/.local/bin/instrument-server <<'WRAPPER'
          #!/bin/bash
          export LD_LIBRARY_PATH="$HOME/.local/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"
          exec "$HOME/.local/opt/instrument-script-server/bin/instrument-server" "$@"
          WRAPPER

          cat > ~/.local/bin/instrument-worker <<'WRAPPER'
          #!/bin/bash
          export LD_LIBRARY_PATH="$HOME/.local/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"
          exec "$HOME/.local/opt/instrument-script-server/bin/instrument-worker" "$@"
          WRAPPER

          chmod +x ~/.local/bin/instrument-server ~/.local/bin/instrument-worker

          # Add ~/.local/bin to PATH (if not already)
          if [[ ":$PATH:" != *":$HOME/.local/bin:"* ]]; then
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.bashrc
            export PATH="$HOME/.local/bin:$PATH"
          fi

          # Verify installation
          instrument-server --version
          ```

          **To uninstall:**
          ```bash
          rm -rf ~/.local/opt/instrument-script-server
          rm -f ~/.local/bin/instrument-server ~/.local/bin/instrument-worker
          ```

          ### Option 3: Run Directly (For testing or containers)

          ```bash
          # Extract and run directly
          tar -xzf instrument-script-server-linux-x64.tar.gz
          cd instrument-script-server-linux-x64

          # Run with library path set
          export LD_LIBRARY_PATH="$PWD/bin:$LD_LIBRARY_PATH"
          ./bin/instrument-server --version
          ```

          ## Usage

          Once installed via any method above:

          ```bash
          # Start the server daemon
          instrument-server daemon start

          # Start instruments
          instrument-server start configs/instrument1.yaml

          # Run a measurement
          instrument-server measure my_measurement.lua

          # Check status
          instrument-server list

          # Shutdown
          instrument-server daemon stop
          ```

          ## Plugin Development

          The `include/` directory contains all headers needed for developing custom instrument plugins.

          To use the headers:
          ```bash
          # If installed to /opt
          gcc -I/opt/instrument-script-server/include your_plugin.c -o your_plugin.so

          # If installed to ~/.local/opt
          gcc -I~/.local/opt/instrument-script-server/include your_plugin.c -o your_plugin.so
          ```

          See the official documentation for the complete plugin development guide.

          ## Why /opt?

          - **FHS Compliant**: `/opt` is designated for "add-on application software packages"
          - **No Conflicts**: Doesn't interfere with system package manager (apt, yum, etc.)
          - **Clean Uninstall**: Simply delete the directory
          - **Multiple Versions**: Can install multiple versions side-by-side
          - **Bundled Dependencies**: Keeps all dependencies together, avoiding library version conflicts

          ## Dependencies

          All required libraries are included in the `bin/` directory. No additional system dependencies need to be installed.

          ## System Requirements

          - Linux x64 (glibc 2.31+)
          - Ubuntu 20.04+, Debian 10+, RHEL 8+, or similar distributions

          ## Troubleshooting

          ### "error while loading shared libraries"

          If you see this error, ensure `LD_LIBRARY_PATH` is set correctly:

          ```bash
          # For /opt installation
          export LD_LIBRARY_PATH="/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"

          # For user installation
          export LD_LIBRARY_PATH="$HOME/.local/opt/instrument-script-server/bin:$LD_LIBRARY_PATH"
          ```

          The wrapper scripts handle this automatically.

          ## License

          See the `LICENSE` file in this directory and the `licenses/` directory for all applicable licenses.
          EOF

          echo "✓ README.md created"

          echo ""
          echo "=== Verifying All Dependencies Are Bundled ==="
          echo "Checking for missing dependencies..."
          missing_deps=0
          for exe in release-staging/instrument-script-server-linux-x64/bin/instrument-*; do
            if [ -f "$exe" ] && [ -x "$exe" ]; then
              echo "Checking $(basename $exe)..."
              if LD_LIBRARY_PATH="release-staging/instrument-script-server-linux-x64/bin:$LD_LIBRARY_PATH" \
                ldd "$exe" | grep "not found" > /dev/null; then
                echo "  ✗ ERROR: Missing dependencies!"
                LD_LIBRARY_PATH="release-staging/instrument-script-server-linux-x64/bin:$LD_LIBRARY_PATH" \
                  ldd "$exe" | grep "not found"
                missing_deps=1
              else
                echo "  ✓ All dependencies present"
              fi
            fi
          done

          if [ $missing_deps -eq 1 ]; then
            echo ""
            echo "ERROR: Some dependencies are missing from the package!"
            exit 1
          fi

          echo ""
          echo "=== Final Release Structure ==="
          tree release-staging/instrument-script-server-linux-x64 || find release-staging/instrument-script-server-linux-x64 -type f | sort

          echo ""
          echo "=== Dependency Count ==="
          echo "Total .so files in package:"
          find release-staging/instrument-script-server-linux-x64/bin -name "*.so*" -type f | wc -l

          echo ""
          echo "=== License Files ==="
          echo "Total licenses collected:"
          find release-staging/instrument-script-server-linux-x64/licenses -type f | wc -l

      - name: Create release archive
        run: |
          cd release-staging
          tar -czf instrument-script-server-linux-x64.tar.gz instrument-script-server-linux-x64
          sha256sum instrument-script-server-linux-x64.tar.gz > instrument-script-server-linux-x64.tar.gz.sha256
          cd ..

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instrument-script-server-linux-x64
          path: |
            release-staging/instrument-script-server-linux-x64.tar.gz
            release-staging/instrument-script-server-linux-x64.tar.gz.sha256
          retention-days: 7

      - name: Setup tmate session for debugging (on failure)
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
