name: CI Pipeline and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Build and test for Linux (runs on all pushes and tags)
  linux-build:
    uses: ./.github/workflows/linux-ci.yml
    permissions:
      contents: read

  # Build and test for Windows (runs on all pushes and tags)
  windows-build:
    uses: ./.github/workflows/windows-ci.yml
    permissions:
      contents: read

  # Create release with all artifacts (only runs on tag pushes after successful builds)
  create-release:
    needs: [linux-build, windows-build]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/create-release.yml
    permissions:
      contents: write
