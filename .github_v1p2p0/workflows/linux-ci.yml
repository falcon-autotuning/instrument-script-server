name: Linux Build and Test

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    name: Build and Test on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "73af4de996897cb45dcf5034d16a551a3cf476f7"

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            build/vcpkg_installed
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-linux-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang \
            lld \
            llvm

      - name: Install dependencies via vcpkg
        run: |
          vcpkg install --triplet x64-linux
        shell: bash

      - name: Configure CMake with Clang + Ninja
        run: |
          cmake -B build \
            -S . \
            -G "Ninja" \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON

      - name: Build project
        run: |
          ninja -C build -v

      - name: List build outputs (debug)
        run: |
          echo "=== Executables ==="
          find build -type f -executable -name "instrument-*" | xargs ls -lh
          echo ""
          echo "=== Shared Libraries ==="
          find build -type f -name "*.so*" | xargs ls -lh
          echo ""
          echo "=== Test Executables ==="
          find build/tests -type f -executable 2>/dev/null | xargs ls -lh || echo "No test executables found"
          echo ""
          echo "=== Tools ==="
          find build -type f -executable -name "template-expander" 2>/dev/null | xargs ls -lh || echo "template-expander not found"

      - name: Run unit tests
        run: |
          # Add build directory to PATH for executables (instrument-worker, template-expander, etc.)
          export PATH="$PWD/build:$PATH"

          # Set library paths
          export LD_LIBRARY_PATH="$PWD/build:$PWD/build/vcpkg_installed/x64-linux/lib:$LD_LIBRARY_PATH"

          # Verify critical executables are accessible
          echo "Checking for instrument-worker..."
          which instrument-worker || echo "WARNING: instrument-worker not in PATH"

          echo "Checking for template-expander..."
          which template-expander || echo "WARNING: template-expander not in PATH (some tests may fail)"

          # Run tests
          ./build/tests/unit_tests

      - name: Run integration tests
        run: |
          # Add build directory to PATH
          export PATH="$PWD/build:$PATH"

          # Set library paths
          export LD_LIBRARY_PATH="$PWD/build:$PWD/build/vcpkg_installed/x64-linux/lib:$LD_LIBRARY_PATH"

          # Run tests
          ./build/tests/integration_tests

      - name: Collect release artifacts
        run: |
          mkdir -p release-staging/instrument-script-server-linux-x64/{bin,lib,licenses}

          # Copy executables
          find build -maxdepth 1 -type f -executable -name "instrument-*" \
            -exec cp {} release-staging/instrument-script-server-linux-x64/bin/ \;

          # Copy template-expander if it exists (needed for runtime)
          if [ -f "build/template-expander" ]; then
            cp build/template-expander release-staging/instrument-script-server-linux-x64/bin/
          fi

          # Copy core shared library
          find build -maxdepth 1 -type f -name "libinstrument-server-core.so*" \
            -exec cp {} release-staging/instrument-script-server-linux-x64/lib/ \;

          # Copy vcpkg dependencies
          if [ -d "build/vcpkg_installed/x64-linux/lib" ]; then
            find build/vcpkg_installed/x64-linux/lib -type f -name "*.so*" \
              -exec cp -P {} release-staging/instrument-script-server-linux-x64/lib/ \;
          fi

          # Collect all licenses
          echo "Collecting licenses..."
          cp LICENSE release-staging/instrument-script-server-linux-x64/licenses/LICENSE || true

          # Collect vcpkg package licenses
          if [ -d "build/vcpkg_installed/x64-linux/share" ]; then
            find build/vcpkg_installed/x64-linux/share -type f \
              \( -name "copyright" -o -name "LICENSE*" -o -name "COPYING*" \) \
              -exec bash -c 'pkg=$(dirname {} | xargs basename); cp {} release-staging/instrument-script-server-linux-x64/licenses/${pkg}_LICENSE.txt' \;
          fi

          # Copy vcpkg manifest
          cp vcpkg.json release-staging/instrument-script-server-linux-x64/ || true

          # Create README
          cat > release-staging/instrument-script-server-linux-x64/README.md << 'EOF'
          # Instrument Script Server - Linux x64 Release

          ## Installation

          ```bash
          # Extract archive
          tar -xzf instrument-script-server-linux-x64.tar.gz
          cd instrument-script-server-linux-x64

          # Install binaries
          sudo install -m 755 bin/instrument-server /usr/local/bin/
          sudo install -m 755 bin/instrument-worker /usr/local/bin/

          # Install template-expander if present
          if [ -f "bin/template-expander" ]; then
            sudo install -m 755 bin/template-expander /usr/local/bin/
          fi

          # Install libraries
          sudo install -m 644 lib/*.so* /usr/local/lib/
          sudo ldconfig
          ```

          ## Usage

          ```bash
          # Start the server daemon
          instrument-server daemon start

          # Start instruments
          instrument-server start configs/instrument1.yaml

          # Run a measurement
          instrument-server measure my_measurement.lua

          # Check status
          instrument-server list

          # Shutdown
          instrument-server daemon stop
          ```

          ## Dependencies

          All required libraries are included in the `lib/` directory.

          ## License

          See the `licenses/` directory for all applicable licenses.
          EOF

          echo "=== Release Structure ==="
          tree release-staging/instrument-script-server-linux-x64 || find release-staging/instrument-script-server-linux-x64

      - name: Create release archive
        run: |
          cd release-staging
          tar -czf instrument-script-server-linux-x64.tar.gz instrument-script-server-linux-x64
          sha256sum instrument-script-server-linux-x64.tar.gz > instrument-script-server-linux-x64.tar.gz.sha256
          cd ..

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instrument-script-server-linux-x64
          path: |
            release-staging/instrument-script-server-linux-x64.tar.gz
            release-staging/instrument-script-server-linux-x64.tar.gz.sha256
          retention-days: 7

      - name: Setup tmate session for debugging (on failure)
        if: failure()
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          limit-access-to-actor: true
